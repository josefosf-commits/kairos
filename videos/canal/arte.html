<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Joseph - arte do canal</title>
<style>
@font-face { font-family: "Kalam"; font-weight: 700; src: url("../_lib/kalam-700.woff2") format("woff2"); }
html, body { margin: 0; background: #000; overflow: hidden; }
svg { display: block; }
.hand { font-family: "Kalam", cursive; font-weight: 700; }
.sans { font-family: "Inter", sans-serif; }
</style></head>
<body><svg id="root" xmlns="http://www.w3.org/2000/svg"><defs>
<radialGradient id="gVignette" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.72"/></radialGradient>
<radialGradient id="gLogoA" cx="50%" cy="38%" r="70%"><stop offset="0%" stop-color="#3f5a34"/><stop offset="100%" stop-color="#0e120c"/></radialGradient>
<radialGradient id="gLogoB" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#ffc06b"/><stop offset="60%" stop-color="#e0607e"/><stop offset="100%" stop-color="#3a3f7a"/></radialGradient>
<linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#07080b" stop-opacity="0"/><stop offset="35%" stop-color="#07080b" stop-opacity="0.55"/><stop offset="100%" stop-color="#07080b" stop-opacity="0.75"/></linearGradient>
</defs><g id="frame"></g></svg>
<script src="../_lib/rig.js"></script>
<script>
const CREAM = "#f4efe6", GREEN = "#30a46c", GOLD = "#ffc53d";
const P0 = over => Object.assign({ x: 960, c: JOSEPH }, face(Object.assign({ smile: 8, look: [0, 4], lid: 0.06, browAng: 0.35, mouthW: 20 }, over || {})));
const bust = P => personBack(P) + personHead(P, 0);
// logo: variant "A" (verde) or "B" (pôr do sol)
function logo(v) {
  const bg = v === "B" ? "url(#gLogoB)" : "url(#gLogoA)";
  let o = `<rect width="800" height="800" fill="${bg}"/>`;
  o += `<circle cx="400" cy="330" r="250" fill="#fff" opacity="${v === "B" ? 0.12 : 0.06}"/>`;
  o += `<g transform="translate(400 380) scale(1.75) translate(-960 -470)">${bust(P0())}</g>`;
  return o;
}
// banner 2560x1440 (área segura 1546x423 no centro: x 507-2053, y 508-931)
function banner() {
  let o = `<g transform="scale(${1440 / 1080})">${streetBg(900)}</g>`;
  o += `<rect width="2560" height="1440" fill="#1a1530" opacity="0.25"/>`;
  o += `<rect width="2560" height="1440" fill="url(#gShade)"/>`;
  // Joseph à esquerda da área segura, cortado na base da faixa
  o += `<clipPath id="strip"><rect x="0" y="0" width="2560" height="931"/></clipPath>`;
  o += `<g clip-path="url(#strip)"><ellipse cx="760" cy="760" rx="300" ry="300" fill="#ffd79a" opacity="0.35"/><g transform="translate(760 735) scale(0.98) translate(-960 -470)">${bust(P0({ smile: 10 }))}</g></g>`;
  o += `<text class="hand" x="1050" y="735" font-size="190" fill="${CREAM}" stroke="#000" stroke-width="22" paint-order="stroke">JOSEPH</text>`;
  o += `<text class="hand" x="1062" y="815" font-size="45" fill="${GOLD}" stroke="#000" stroke-width="12" paint-order="stroke">Curtas animados sobre disciplina, foco e hábitos</text>`;
  o += `<text class="hand" x="1062" y="890" font-size="48" fill="${CREAM}" stroke="#000" stroke-width="10" paint-order="stroke">Melhore <tspan fill="${GREEN}">1%</tspan> por dia.</text>`;
  if (window.GUIDE) o += `<rect x="507" y="508" width="1546" height="423" fill="none" stroke="#ff2d55" stroke-width="6" stroke-dasharray="20 14"/><rect x="0" y="508" width="2560" height="423" fill="none" stroke="#00e5ff" stroke-width="4" stroke-dasharray="10 10"/>`;
  return o;
}
window.draw = (what, w, h) => {
  const s = document.getElementById("root"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  document.getElementById("frame").innerHTML = what === "banner" ? banner() : logo(what);
};
</script></body></html>
