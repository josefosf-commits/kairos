<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>E-SE-LER-MENTES</title>
<style>
  @font-face { font-family: "Kalam"; font-weight: 700; src: url("../_lib/kalam-700.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root, #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
  .ov { position: absolute; font-family: "Kalam", cursive; font-weight: 700; color: #fff; pointer-events: none; opacity: 0;
        -webkit-text-stroke: 12px #111; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.35); line-height: 1; white-space: nowrap; transform-origin: 50% 50%; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.3) 100%); }
  #bubbles { position: absolute; inset: 0; }
  .bub { position: absolute; font-family: "Kalam", cursive; font-weight: 700; color: #1d1d1d; padding: 10px 26px; border-radius: 999px;
         border: 6px solid #1d1d1d; white-space: nowrap; transform-origin: 50% 100%; opacity: 0; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .bub::after { content: ""; position: absolute; left: 50%; bottom: -34px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%;
                background: inherit; border: 5px solid #1d1d1d; }
  #title { left: 50%; top: 40px; transform: translateX(-50%); font-size: 150px; }
  #count { right: 80px; top: 50px; font-size: 200px; color: #ff6b6b; }
  #ask { left: 50%; top: 50px; font-size: 150px; color: #ffd54a; }
  #cta { left: 50%; top: 50px; font-size: 104px; color: #ffd54a; }
  #follow { left: 50%; top: 190px; font-size: 84px; color: #fff; }
  #cap { left: 50%; bottom: 56px; transform: translateX(-50%); width: 1700px; text-align: center; font-size: 80px; line-height: 1.12;
         -webkit-text-stroke: 10px #111; white-space: normal; opacity: 0; }
</style>
</head>
<body>
<div id="root"><div id="frame">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div id="bubbles"></div>
  <div class="ov" id="title">E SE...?</div>
  <div class="ov" id="count"></div>
  <div class="ov" id="ask">PERGUNTA.</div>
  <div class="ov" id="cta">DE QUEM VOCÊ LERIA A MENTE?</div>
  <div class="ov" id="follow">comenta e segue pro próximo E SE</div>
  <div class="ov" id="cap"></div>
</div></div>
<script src="build/cena3d.js"></script>
</body>
</html>
