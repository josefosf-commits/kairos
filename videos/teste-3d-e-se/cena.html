<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TESTE-3D-E-SE</title>
<style>
  @font-face { font-family: "Kalam"; font-weight: 700; src: url("../_lib/kalam-700.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #root, #frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
  .ov { position: absolute; font-family: "Kalam", cursive; font-weight: 700; color: #fff; pointer-events: none;
        -webkit-text-stroke: 12px #111; paint-order: stroke fill; text-shadow: 0 8px 0 rgba(0,0,0,.35); }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%); }
  #title { left: 50%; top: 40px; transform: translateX(-50%); font-size: 150px; line-height: 1; white-space: nowrap; }
  #badge { left: 56px; top: 44px; font-size: 104px; line-height: 1; color: #ffd54a; }
  #count { right: 70px; top: 50px; font-size: 140px; line-height: 1; color: #ff6b6b; }
  #q { font-size: 190px; color: #ffd54a; line-height: 1; }
  #dots { font-size: 160px; line-height: 1; }
  #zzz { font-size: 110px; color: #bcd2ff; line-height: 1; }
  #sim { left: 50%; top: 60px; font-size: 170px; line-height: 1; white-space: nowrap; transform-origin: 50% 50%; }
  #sim .s { color: #52d273; } #sim .n { color: #ff5a5a; }
  #cap { left: 50%; bottom: 56px; transform: translateX(-50%); width: 1640px; text-align: center; font-size: 76px; line-height: 1.12;
         -webkit-text-stroke: 10px #111; }
</style>
</head>
<body>
<div id="root"><div id="frame">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="vig"></div>
  <div class="ov" id="title">E SE...?</div>
  <div class="ov" id="badge"></div>
  <div class="ov" id="count">x1</div>
  <div class="ov" id="q">?</div>
  <div class="ov" id="dots">...</div>
  <div class="ov" id="zzz">Zzz</div>
  <div class="ov" id="sim"><span class="s">SIM</span> ou <span class="n">NÃO</span>?</div>
  <div class="ov" id="cap"></div>
</div></div>
<script src="build/cena3d.js"></script>
</body>
</html>
