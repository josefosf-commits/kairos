  #qq { font-size: 150px; color: #ffd54a; }
  #think { font-size: 160px; color: #ff4d6d; }
  #cap { left: 50%; bottom: 420px; transform: translateX(-50%); width: 960px; text-align: center; font-size: 78px; line-height: 1.12;
